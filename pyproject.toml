[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "another_dependency_injector"
version = "0.1.5"
authors = [
    { name="nekit508", email="lastp508@gmail.com" },
]
description = "Краткое описание вашего пакета"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.7"
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python"
]

[project.urls]
"Homepage" = "https://github.com/nekit508/another-dependency-injector"
"Bug Tracker" = "https://github.com/nekit508/another-dependency-injector/issues"
