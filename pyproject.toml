[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "another-denendecy-injector"
version = "0.0.1"
authors = [
  { name="nekit508", email="lastp508@gmail.com" },
]
description = "Краткое описание вашего пакета"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/ваш-профиль/ваш-проект"
"Bug Tracker" = "https://github.com/ваш-профиль/ваш-проект/issues"